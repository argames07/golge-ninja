<style>
:root{
  --ink:#12082b; --deep:#05020e; --pink:#ff2e88; --cyan:#38f3ff; --moon:#ffe6a8; --gold:#ffd23f; --red:#ff3b4f;
  --text:#f3eefe; --muted:#a99cc9;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--text:#f3eefe}}
:root[data-theme="dark"]{--text:#f3eefe}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--deep);color:var(--text);
  font-family:Saira,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none}
button{-webkit-touch-callout:none;touch-action:manipulation}
.disp{font-family:Bungee,Impact,"Arial Black",sans-serif;font-weight:400;letter-spacing:.02em}

#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;align-items:flex-start;
  justify-content:space-between;padding:0 14px;pointer-events:none;z-index:2;transition:opacity .25s}
#hud.off{opacity:0}
#dist{font-size:44px;line-height:1;text-shadow:0 0 18px rgba(255,46,136,.55),0 2px 0 #000}
#dist small{font-size:.42em;opacity:.8;margin-left:2px}
.chip{display:flex;align-items:center;gap:6px;font-weight:700;font-size:18px;background:rgba(18,8,43,.55);
  border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 12px 6px 8px;backdrop-filter:blur(4px)}
.coin{width:16px;height:16px;transform:rotate(45deg);background:linear-gradient(135deg,#fff3a6,var(--gold) 55%,#c98a00);
  border-radius:3px;box-shadow:0 0 10px rgba(255,210,63,.7)}
.ibtn{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.18);
  background:rgba(18,8,43,.55);color:var(--text);font-size:18px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px)}
.ibtn:focus-visible,button:focus-visible{outline:2px dashed var(--cyan);outline-offset:3px}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:5;padding:24px;text-align:center;transition:opacity .3s}
.screen.hidden{opacity:0;pointer-events:none}
#menu{justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 9vh);
  background:linear-gradient(to top,rgba(5,2,14,.85) 0%,rgba(5,2,14,0) 55%)}
.title{font-size:clamp(46px,14vw,86px);line-height:.9;margin:0;color:#fff;
  text-shadow:0 0 6px #fff,0 0 22px var(--pink),0 0 48px var(--pink)}
.title span{display:block;font-size:.56em;color:var(--cyan);text-shadow:0 0 6px #fff,0 0 20px var(--cyan),0 0 40px var(--cyan);letter-spacing:.16em}
.how{margin:18px 0 22px;color:var(--muted);font-size:16px;line-height:1.5;max-width:30ch}
.how b{color:var(--text)}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.go{font-family:Bungee,Impact,sans-serif;font-size:24px;color:#1a0420;background:var(--pink);border:0;border-radius:14px;
  padding:14px 34px;box-shadow:0 0 0 2px #ff8cbf inset,0 0 26px rgba(255,46,136,.6),0 6px 0 #8a0f48;transform:translateY(-3px)}
.go:active{transform:translateY(2px);box-shadow:0 0 0 2px #ff8cbf inset,0 0 18px rgba(255,46,136,.5),0 1px 0 #8a0f48}
.ghost{font-weight:700;font-size:16px;color:var(--text);background:rgba(18,8,43,.6);border:1px solid rgba(56,243,255,.45);
  border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:8px}
.stat{color:var(--muted);font-size:15px;margin-top:14px;display:flex;gap:16px;justify-content:center}
.stat b{color:var(--text)}

.panel{background:rgba(14,6,34,.88);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:26px 22px 22px;
  width:min(360px,92vw);box-shadow:0 0 0 1px rgba(255,46,136,.25),0 30px 80px rgba(0,0,0,.6);backdrop-filter:blur(8px)}
#over{background:rgba(5,2,14,.45)}
.big{font-size:64px;line-height:1;margin:6px 0 2px;color:#fff;text-shadow:0 0 24px rgba(56,243,255,.6)}
.big small{font-size:.38em}
.sub{color:var(--muted);font-size:15px}
.rec{color:var(--gold);font-weight:700;min-height:1.4em;margin:8px 0 4px}
.earn{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:18px;margin:4px 0 18px}

#shop{z-index:6}
#shop .panel{width:min(420px,94vw);max-height:86vh;overflow:auto;text-align:left}
#shop h2{margin:0 0 4px;font-size:26px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
.item{position:relative;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px;background:rgba(255,255,255,.03);
  color:var(--text);text-align:left;display:flex;flex-direction:column;gap:8px}
.item.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset,0 0 18px rgba(56,243,255,.25)}
.sw{height:46px;border-radius:10px;position:relative;overflow:hidden;background:#0a0418}
.sw i{position:absolute;left:10%;right:-10%;top:50%;height:8px;margin-top:-4px;border-radius:8px;transform:skewY(-8deg)}
.item b{font-size:15px}
.price{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.price .coin{width:12px;height:12px}
.close{margin-top:4px;width:100%}
.pw{display:flex;gap:6px;position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:2;pointer-events:none}
.pw span{font-weight:700;font-size:14px;background:rgba(18,8,43,.6);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 10px}
#zone{position:fixed;left:0;right:0;top:28%;text-align:center;z-index:3;pointer-events:none;opacity:0;transition:opacity .5s}
#zone .zn{font-size:clamp(30px,9vw,52px);color:#fff;text-shadow:0 0 8px #fff,0 0 26px var(--zc,#ff2e88)}
#zone .zs{color:var(--muted);font-size:15px;margin-top:4px}
.mis{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.mi{border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;background:rgba(255,255,255,.03);display:flex;gap:12px;align-items:center}
.mi .tx{flex:1;min-width:0}.mi .tx b{display:block;font-size:15px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));border-radius:6px}
.mi .rw{display:flex;align-items:center;gap:5px;font-weight:700;font-size:14px;white-space:nowrap}
.claim{font-family:Bungee,Impact,sans-serif;font-size:14px;border:0;border-radius:10px;padding:8px 12px;background:var(--gold);color:#2a1800;box-shadow:0 0 14px rgba(255,210,63,.5)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--pink);color:#fff;font-size:12px;display:inline-grid;place-items:center;padding:0 5px}
.gem{width:16px;height:16px;display:inline-block;flex:none;background:linear-gradient(160deg,#e6fdff 0%,#6fe9ff 35%,#7a5cff 75%,#3a1fbf 100%);
  clip-path:polygon(50% 100%,0 38%,22% 6%,78% 6%,100% 38%);filter:drop-shadow(0 0 6px rgba(111,233,255,.8))}
.tabs{display:flex;gap:6px;margin:14px 0 4px;background:rgba(255,255,255,.05);padding:4px;border-radius:12px}
.tab{flex:1;border:0;border-radius:9px;padding:9px 6px;background:transparent;color:var(--muted);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.tab.on{background:rgba(56,243,255,.16);color:var(--text);box-shadow:0 0 0 1px rgba(56,243,255,.5) inset}
.wallet{display:flex;gap:10px;margin-top:10px}
.wallet span{display:flex;align-items:center;gap:6px;font-weight:700;background:rgba(255,255,255,.06);border-radius:999px;padding:5px 12px 5px 8px}
.pack{border:1px solid rgba(122,92,255,.45);border-radius:16px;padding:14px 12px;background:linear-gradient(160deg,rgba(111,233,255,.08),rgba(122,92,255,.12));
  color:var(--text);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
.pack .gems{display:flex;gap:2px;height:30px;align-items:flex-end}
.pack b{font-size:22px;font-family:Bungee,Impact,sans-serif}
.pack .tl{font-weight:700;background:#fff;color:#2a1060;border-radius:10px;padding:6px 14px;font-size:15px}
.pack .bonus{position:absolute;top:-9px;right:-6px;background:var(--pink);color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:2px 7px}
.note{font-size:12.5px;color:var(--muted);background:rgba(255,210,63,.08);border:1px dashed rgba(255,210,63,.4);border-radius:10px;padding:8px 10px;margin-top:4px}
.price .gem{width:12px;height:12px}
.cd{font-family:Bungee,Impact,sans-serif;font-size:56px;color:#fff;text-shadow:0 0 22px rgba(111,233,255,.7);margin:6px 0}
.rv{font-family:Bungee,Impact,sans-serif;font-size:20px;border:0;border-radius:14px;padding:14px 22px;color:#170a3a;
  background:linear-gradient(160deg,#e6fdff,#6fe9ff 45%,#9b84ff);box-shadow:0 0 26px rgba(111,233,255,.55),0 6px 0 #3a1fbf;display:inline-flex;align-items:center;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:9;
  background:rgba(14,6,34,.92);border:1px solid rgba(255,255,255,.15);padding:10px 16px;border-radius:12px;font-weight:700;
  opacity:0;transition:opacity .25s;pointer-events:none}
@media (prefers-reduced-motion: reduce){.screen{transition:none}}

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'), ctx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- kayıt ---------- */
const store={get(k,d){try{const v=localStorage.getItem('gn-'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('gn-'+k,JSON.stringify(v))}catch(e){}}};
let gems=store.get('gems',10), boosts=store.get('boosts',{shield:0,magnet:0});
let best=store.get('best',0), coins=store.get('coins',0), owned=store.get('owned',['neon']), skin=store.get('skin','neon'), muted=store.get('muted',false);

const SKINS=[
  {id:'neon',  name:'Neon Pembe', price:0,    c:['#ff2e88','#ff7ab8']},
  {id:'buz',   name:'Buz Mavisi', price:150,  c:['#38f3ff','#b8fbff']},
  {id:'altin', name:'Altın',      price:400,  c:['#ffd23f','#fff1a8']},
  {id:'zumrut',name:'Zümrüt',     price:800,  c:['#2bff9a','#b6ffd9']},
  {id:'alev',  name:'Mor Alev',   price:1500, c:['#a64dff','#ff5ad1']},
  {id:'gokkus',name:'Gökkuşağı',  price:3000, c:null},
  {id:'ejder', name:'Ejderha Ateşi',gem:60,   c:'fire'},
  {id:'yildiz',name:'Yıldız Tozu',  gem:120,  c:'star'}
];
const PACKS=[
  {id:'elmas_80',  n:80,  tl:'29,99 ₺'},
  {id:'elmas_250', n:250, tl:'79,99 ₺', bonus:'+%10'},
  {id:'elmas_600', n:600, tl:'179,99 ₺',bonus:'+%25'},
  {id:'elmas_1500',n:1500,tl:'399,99 ₺',bonus:'En iyi fiyat'}
];
const ITEMS=[
  {id:'shield',name:'Kalkanla başla',d:'Bir sonraki oyuna kalkanla başla',gem:5},
  {id:'magnet',name:'Mıknatısla başla',d:'İlk 15 saniye altınları çek',gem:5},
  {id:'gold',  name:'500 altın',d:'Atkılar için altın al',gem:10}
];
const REVIVE_COST=10;
const skinCol=(t,i)=>{const s=SKINS.find(s=>s.id===skin)||SKINS[0];
  if(!s.c){return `hsl(${(t*120+i*28)%360} 100% 62%)`}
  if(s.c==='fire'){const k=(Math.sin(t*9+i)+1)/2;return i<0?`hsl(${45+k*15} 100% 70%)`:`hsl(${8+k*28} 100% ${52+k*8}%)`}
  if(s.c==='star'){const k=(Math.sin(t*6+i*1.7)+1)/2;return i<0?'#ffffff':`hsl(${48-k*8} 100% ${70+k*25}%)`}
  return i<0?s.c[1]:s.c[0];};

/* ---------- ses ---------- */
let AC=null;
function snd(type){
  if(muted)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
    if(type==='rope'){o.type='triangle';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(240,t+.09);g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.start(t);o.stop(t+.11)}
    else if(type==='coin'){o.type='square';o.frequency.setValueAtTime(1320,t);o.frequency.setValueAtTime(1760,t+.05);g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.start(t);o.stop(t+.17)}
    else if(type==='fly'){o.type='sine';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(620,t+.12);g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.start(t);o.stop(t+.15)}
    else if(type==='die'){o.type='sawtooth';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(40,t+.5);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.55);o.start(t);o.stop(t+.56)}
    else if(type==='miss'){o.type='triangle';o.frequency.setValueAtTime(180,t);g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.start(t);o.stop(t+.09)}
  }catch(e){}
}

/* ---------- ekran ---------- */
const VH=800; let W=0,H=0,DPR=1,S=1,VW=450;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR|0;cv.height=H*DPR|0;
  S=H/VH; VW=W/S; buildBg();}
addEventListener('resize',resize);

/* ---------- yardımcılar ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const hsh=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
function glow(r,inner,outer){const c=document.createElement('canvas');const R=r*3;c.width=c.height=R*2;const g=c.getContext('2d');
  const gr=g.createRadialGradient(R,R,0,R,R,R);gr.addColorStop(0,inner);gr.addColorStop(.25,outer);gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,R*2,R*2);return c;}
const GL={cyan:glow(14,'rgba(200,255,255,.9)','rgba(56,243,255,.35)'),gold:glow(10,'rgba(255,250,200,.9)','rgba(255,210,63,.35)'),
  red:glow(20,'rgba(255,200,200,.8)','rgba(255,59,79,.4)'),moon:glow(150,'rgba(255,240,200,.35)','rgba(255,180,120,.12)')};

/* ---------- bölgeler ---------- */
const ZONES=[
 {n:'Neon Şehir',s:'Her şey burada başladı',sky:['#05020e','#160a35','#3a0d3f'],ly:['#1d0f3f','#130829','#07030f'],rim:[255,46,136],moon:['#fff6d8','#ffcf86'],roof:0},
 {n:'Gece Limanı',s:'Vinçlerin arasından geç',sky:['#010812','#06233a','#0d4a5a'],ly:['#0b2a3d','#06192a','#020a12'],rim:[56,243,255],moon:['#eefcff','#9fdcff'],roof:2},
 {n:'Kızıl Tapınak',s:'Çatılar sivri, rüzgâr sert',sky:['#0a0204','#2a0710','#5a1418'],ly:['#3a0f14','#22070c','#0c0204'],rim:[255,120,60],moon:['#fff0e0','#ff8a5a'],roof:1},
 {n:'Fırtına Kuleleri',s:'Sadece en iyiler buraya ulaşır',sky:['#020108','#120a3a','#2a1a6a'],ly:['#1a1450','#100a33','#050212'],rim:[166,77,255],moon:['#f4eaff','#c9a6ff'],roof:3}
];
const ZLEN=400; // metre
const hex=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const mix=(a,b,t)=>{const A=Array.isArray(a)?a:hex(a),B=Array.isArray(b)?b:hex(b);return A.map((v,i)=>Math.round(v+(B[i]-v)*t))};
const rgb=(c,al=1)=>`rgba(${c[0]},${c[1]},${c[2]},${al})`;
let Z=null, zoneIdx=0;
function zoneAt(m){
  const i=Math.floor(m/ZLEN), f=(m%ZLEN)/ZLEN, a=ZONES[i%ZONES.length], b=ZONES[(i+1)%ZONES.length];
  const t=f>.88?(f-.88)/.12:0, e=t*t*(3-2*t);
  return {i,cur:a,roof:(t>.5?b:a).roof,sky:a.sky.map((c,k)=>mix(c,b.sky[k],e)),ly:a.ly.map((c,k)=>mix(c,b.ly[k],e)),rim:mix(a.rim,b.rim,e),moon:a.moon.map((c,k)=>mix(c,b.moon[k],e))};
}

/* ---------- arka plan ---------- */
let stars=[], bgSky=null;
function buildBg(){
  bgSky=ctx.createLinearGradient(0,0,0,H);bgSky.addColorStop(0,'#05020e');bgSky.addColorStop(.55,'#160a35');bgSky.addColorStop(1,'#3a0d3f');
  stars=[];for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random()*.6,r:Math.random()*1.3+.3,p:Math.random()*6});
}
const LAYERS=[
  {par:.12,cell:70, hMin:120,hMax:260,col:'#1d0f3f',win:0},
  {par:.3, cell:95, hMin:170,hMax:330,col:'#130829',win:.06},
  {par:.62,cell:130,hMin:120,hMax:280,col:'#07030f',win:.1,rim:true}
];
function drawLayer(L,li,camX,camY,t){
  const off=camX*L.par, i0=Math.floor(off/L.cell)-1, i1=i0+Math.ceil(VW/L.cell)+3, base=VH+40-camY*L.par*.5;
  for(let i=i0;i<=i1;i++){
    const r1=hsh(i*3.1+li*91),r2=hsh(i*7.7+li*13),r3=hsh(i*1.9+li*5);
    const w=L.cell*(.62+r1*.36), h=L.hMin+(L.hMax-L.hMin)*r2, x=(i*L.cell-off)+(L.cell-w)*.5, y=base-h;
    const col=rgb(Z.ly[li]);ctx.fillStyle=col;ctx.fillRect(x,y,w,h+200);
    const rf=Z.roof;
    if(rf===1){ctx.beginPath();ctx.moveTo(x-w*.12,y+4);ctx.quadraticCurveTo(x+w*.5,y-10,x+w*.5,y-28-r3*16);ctx.quadraticCurveTo(x+w*.5,y-10,x+w*1.12,y+4);ctx.fill()}
    else if(rf===2&&r3>.55){ctx.fillRect(x+w*.7,y-90,5,90);ctx.fillRect(x+w*.7-w*.6,y-90,w*.9,5);ctx.fillRect(x+w*.12,y-90,2,40)}
    else if(rf===3){ctx.beginPath();ctx.moveTo(x+w*.35,y);ctx.lineTo(x+w*.5,y-40-r3*60);ctx.lineTo(x+w*.65,y);ctx.fill()}
    else if(r3>.6){ctx.fillRect(x+w*.3,y-18-r3*30,w*.08,18+r3*30)} // anten
    if(L.rim){ctx.fillStyle=rgb(Z.rim,.6);ctx.fillRect(x,y,w,2)}
    if(L.win){
      const cols=Math.floor(w/14), rows=Math.floor(h/18);
      for(let a=0;a<cols;a++)for(let b=0;b<rows;b++){
        const q=hsh(i*31+a*7+b*13+li);if(q>1-L.win){
          ctx.fillStyle=q>1-L.win*.35?'rgba(56,243,255,.5)':(q>1-L.win*.7?'rgba(255,46,136,.45)':'rgba(255,200,120,.35)');
          ctx.fillRect(x+5+a*14,y+10+b*18,6,9)}}
    }
  }
}

/* ---------- dünya ---------- */
let anchors=[],coinsW=[],drones=[],parts=[],texts=[],trail=[],scarf=[],pows=[];
let magnetT=0,shield=false,runSuper=0,runPows=0;
let reviveUsed=false,reviveT=0,invT=0,shopFromRevive=false;
let P,rope,state='menu',camX=0,camY=0,runC=0,startX=0,lastX=0,lastY=300,shake=0,slow=1,deadT=0,time=0,combo=0,paused=false,hintA=null;

function genUntil(xMax){
  while(lastX<xMax){
    const d=(lastX-startX)/40; const hard=Math.min(1,d/1200);
    const gap=rnd(230+hard*70,330+hard*130);
    const nx=lastX+gap, ny=Math.max(110,Math.min(400,lastY+rnd(-150,150)));
    // altınlar: iki çapa arasında yay
    if(Math.random()<.75&&anchors.length>1){
      const n=3+(Math.random()*3|0), mx=(lastX+nx)/2, my=(lastY+ny)/2+rnd(140,230);
      for(let k=0;k<n;k++){const f=(k-(n-1)/2)*34;coinsW.push({x:mx+f,y:my-Math.abs(f)*.55-Math.cos(f/40)*6,taken:false,ph:Math.random()*6})}
    }
    // dron: mesafe arttıkça
    if(d>150&&Math.random()<.18+hard*.3&&anchors.length>2){
      const mx=(lastX+nx)/2+rnd(-30,30); drones.push({x:mx,y:Math.min(560,(lastY+ny)/2+rnd(60,200)),ph:Math.random()*6,amp:rnd(20,60)});
    }
    if(d>40&&Math.random()<.07&&anchors.length>2){
      pows.push({x:(lastX+nx)/2+rnd(-20,20),y:(lastY+ny)/2+rnd(90,170),k:Math.random()<.55?'magnet':'shield',ph:Math.random()*6});
    }
    anchors.push({x:nx,y:ny,pulse:0}); lastX=nx; lastY=ny;
  }
  const cut=camX-200;
  pows=pows.filter(p=>p.x>cut&&!p.got);anchors=anchors.filter(a=>a.x>cut-400); coinsW=coinsW.filter(c=>c.x>cut&&!c.gone); drones=drones.filter(d=>d.x>cut);
}

function reset(){
  anchors=[];coinsW=[];drones=[];parts=[];texts=[];trail=[];pows=[];magnetT=0;shield=false;runSuper=0;runPows=0;zoneIdx=0;
  camX=0;camY=0;startX=0;lastX=0;lastY=260;anchors.push({x:0,y:260,pulse:0});
  genUntil(2400);
  const a=anchors[0], L=230, ang=-0.95;
  P={x:a.x+Math.sin(ang)*L,y:a.y+Math.cos(ang)*L,vx:620,vy:-180};
  rope={a,L,tip:1,tx:a.x,ty:a.y};lastA=null;
  scarf=[];for(let i=0;i<9;i++)scarf.push({x:P.x-i*6,y:P.y,px:P.x-i*6,py:P.y});
  camX=P.x-VW*.32;camY=0;runC=0;combo=0;shake=0;slow=1;deadT=0;
}

/* ---------- ip seçimi ---------- */
let lastA=null;
function pickAnchor(){
  let bestA=null,bs=1e9,back=null,bb=1e9;
  for(const a of anchors){
    const dx=a.x-P.x, dy=a.y-P.y, d=Math.hypot(dx,dy);
    if(d>640||d<60||dy>80)continue;
    if(dx>-10&&a!==lastA){const s=d-dx*.4; if(s<bs){bs=s;bestA=a}}
    else if(dx>-120){if(d<bb){bb=d;back=a}}
  }
  return bestA||back;
}
function press(){
  if(state!=='play'||paused)return;
  const a=pickAnchor();
  if(!a){snd('miss');texts.push({x:P.x,y:P.y-40,t:.8,s:'Çapa yok!',c:'#ff8aa0'});return}
  rope={a,L:0,tip:0,tx:P.x,ty:P.y}; a.pulse=1; snd('rope');
}
function release(){
  if(state!=='play'||!rope)return;
  const attached=rope.tip>=1; if(attached)lastA=rope.a; rope=null;
  if(attached&&P.vx>0){
    const sp=Math.hypot(P.vx,P.vy);
    P.vx*=1.07;P.vy-=70;snd('fly');
    if(sp>1050){combo++;runSuper++;const bonus=combo;texts.push({x:P.x,y:P.y-50,t:1,s:combo>1?`Süper! x${combo}`:'Süper!',c:skinCol(time,0)});
      runC+=bonus;burst(P.x,P.y,10,skinCol(time,0))}
    else combo=0;
  }
}

/* ---------- efektler ---------- */
function burst(x,y,n,c,sp=260){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=rnd(sp*.3,sp);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:rnd(.35,.8),c,r:rnd(1.5,3.5)})}}

/* ---------- fizik ---------- */
const G=1700;
function step(dt){
  time+=dt;
  if(rope){
    if(rope.tip<1){ // ip uzanıyor
      const d=Math.hypot(rope.a.x-P.x,rope.a.y-P.y); rope.tip=Math.min(1,rope.tip+dt*3600/Math.max(80,d));
      rope.tx=P.x+(rope.a.x-P.x)*rope.tip; rope.ty=P.y+(rope.a.y-P.y)*rope.tip;
      if(rope.tip>=1)rope.L=Math.max(90,d);
    } else { rope.tx=rope.a.x; rope.ty=rope.a.y; rope.L=Math.max(110,rope.L-55*dt); }
  }
  P.vy+=G*dt; P.vx*=1-.04*dt;
  P.x+=P.vx*dt; P.y+=P.vy*dt;
  if(rope&&rope.tip>=1){
    const dx=P.x-rope.a.x, dy=P.y-rope.a.y, d=Math.hypot(dx,dy);
    if(d>rope.L){const nx=dx/d,ny=dy/d;P.x=rope.a.x+nx*rope.L;P.y=rope.a.y+ny*rope.L;
      const vr=P.vx*nx+P.vy*ny; if(vr>0){P.vx-=vr*nx;P.vy-=vr*ny}}
  }
  const sp=Math.hypot(P.vx,P.vy); if(sp>1550){P.vx*=1550/sp;P.vy*=1550/sp}
}

function update(dt){
  if(paused)return;
  const sdt=dt*slow;
  if(state==='revive'&&!shopFromRevive){reviveT-=dt;$('rvT').textContent=Math.max(0,Math.ceil(reviveT));if(reviveT<=0){show('revive',false);showOver()}}
  if(invT>0)invT-=dt;
  if(state==='play'||state==='menu'){
    const n=3; for(let i=0;i<n;i++)step(sdt/n);
    if(state==='menu'&&!rope){rope={a:anchors[0],L:230,tip:1,tx:anchors[0].x,ty:anchors[0].y}}
  } else if(state==='dying'){
    for(let i=0;i<3;i++){P.vy+=G*sdt/3;P.x+=P.vx*sdt/3;P.y+=P.vy*sdt/3}
    deadT+=dt; slow=Math.min(1,slow+dt*.8);
    if(deadT>1.1){if(!reviveUsed)showRevive();else showOver();}
  }
  // kamera
  if(state!=='menu'){const tx=P.x-VW*.32+Math.max(0,P.vx)*.12; camX+=(tx-camX)*Math.min(1,dt*5)}
  else camX+=(P.x-VW*.45-camX)*Math.min(1,dt*3);
  const ty=Math.min(0,P.y-170); camY+=(ty-camY)*Math.min(1,dt*4);
  if(state==='play'){
    genUntil(camX+VW*2.2);
    // altın
    if(magnetT>0){magnetT-=dt;for(const c of coinsW){if(c.taken)continue;const dx=P.x-c.x,dy=P.y-c.y,d=Math.hypot(dx,dy);if(d<260){const k=Math.min(1,dt*9*(1.4-d/260));c.x+=dx*k;c.y+=dy*k}}}
    for(const pw of pows){if(!pw.got&&Math.hypot(pw.x-P.x,pw.y-P.y)<36){pw.got=true;runPows++;snd('coin');burst(pw.x,pw.y,16,pw.k==='magnet'?'#ff5a5f':'#38f3ff',240);
      if(pw.k==='magnet'){magnetT=8;texts.push({x:P.x,y:P.y-50,t:1,s:'Mıknatıs!',c:'#ff8a8a'})}else{shield=true;texts.push({x:P.x,y:P.y-50,t:1,s:'Kalkan!',c:'#7ff8ff'})}}}
    for(const c of coinsW){if(!c.taken&&Math.hypot(c.x-P.x,c.y-P.y)<30){c.taken=true;c.gone=false;c.t=0;runC++;snd('coin');burst(c.x,c.y,6,'#ffd23f',160)}}
    coinsW.forEach(c=>{if(c.taken){c.t+=dt;if(c.t>.3)c.gone=true}});
    // dron
    for(const d of drones){const dy=Math.sin(time*2+d.ph)*d.amp;if(!d.dead&&invT<=0&&Math.hypot(d.x-P.x,d.y+dy-P.y)<30){
      if(shield){shield=false;d.dead=true;burst(d.x,d.y+dy,24,'#ff3b4f',380);shake=RM?0:.5;snd('die');texts.push({x:P.x,y:P.y-50,t:1,s:'Kalkan kırıldı',c:'#7ff8ff'})}
      else{die();break}}}
    drones=drones.filter(d=>!d.dead);
    // düşme
    if(P.y>VH+80){
      if(shield){shield=false;rope=null;P.vy=-1350;P.vx=Math.max(P.vx,520);burst(P.x,VH+60,30,'#38f3ff',420);snd('fly');texts.push({x:P.x,y:P.y-120,t:1.2,s:'Kurtuldun!',c:'#7ff8ff'})}
      else die();}
    // bölge değişimi
    const zi=Math.floor(Math.max(0,P.x-startX)/40/ZLEN);
    if(zi!==zoneIdx){zoneIdx=zi;const zz=ZONES[zi%ZONES.length];showZone(zz,zi)}
    const pwEl=$('pw');let ph='';if(magnetT>0)ph+=`<span>🧲 ${Math.ceil(magnetT)}</span>`;if(shield)ph+='<span>🛡️</span>';if(pwEl.innerHTML!==ph)pwEl.innerHTML=ph;
    $('dist').innerHTML=Math.floor(Math.max(0,P.x-startX)/40)+'<small>m</small>';
    $('runCoins').textContent=runC;
  }
  // ipucu çapası
  hintA=(state==='play'&&!rope)?pickAnchor():null;
  // atkı (verlet)
  scarf[0].x=P.x-4;scarf[0].y=P.y-12;
  for(let i=1;i<scarf.length;i++){const s=scarf[i];const vx=(s.x-s.px)*.9,vy=(s.y-s.py)*.9;s.px=s.x;s.py=s.y;s.x+=vx-dt*40;s.y+=vy+dt*120;}
  for(let k=0;k<3;k++)for(let i=1;i<scarf.length;i++){const a=scarf[i-1],b=scarf[i];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,diff=(d-7)/d;b.x-=dx*diff;b.y-=dy*diff}
  // iz
  trail.push({x:P.x,y:P.y,t:.25});trail.forEach(p=>p.t-=dt);trail=trail.filter(p=>p.t>0);
  parts.forEach(p=>{p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt});parts=parts.filter(p=>p.t>0);
  texts.forEach(t=>{t.y-=40*dt;t.t-=dt});texts=texts.filter(t=>t.t>0);
  anchors.forEach(a=>a.pulse=Math.max(0,a.pulse-dt*2));
  shake=Math.max(0,shake-dt*2.5);
}

function die(){
  if(state!=='play')return;state='dying';rope=null;deadT=0;slow=.25;shake=RM?0:1;snd('die');
  burst(P.x,P.y,28,skinCol(time,0),420);burst(P.x,P.y,14,'#ffffff',300);
  if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
}

/* ---------- çizim ---------- */
function drawNinja(t){
  const ang=Math.atan2(P.vy,P.vx), sp=Math.hypot(P.vx,P.vy);
  // atkı
  ctx.lineCap='round';ctx.lineJoin='round';
  for(let pass=0;pass<2;pass++){
    ctx.beginPath();ctx.moveTo(scarf[0].x,scarf[0].y);for(let i=1;i<scarf.length;i++)ctx.lineTo(scarf[i].x,scarf[i].y);
    ctx.strokeStyle=pass?skinCol(t,-1):skinCol(t,0);ctx.globalAlpha=pass?1:.35;ctx.lineWidth=pass?4:12;ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(P.x,P.y);
  const rot=rope&&rope.tip>=1?Math.atan2(rope.a.y-P.y,rope.a.x-P.x)+Math.PI/2:Math.max(-1,Math.min(1,ang*.6));
  ctx.rotate(rot);
  const tuck=Math.min(1,sp/1200);
  ctx.fillStyle='#000';ctx.strokeStyle='rgba(255,46,136,.0)';
  // gövde
  ctx.beginPath();ctx.ellipse(0,2,8,13,0,0,6.283);ctx.fill();
  // baş
  ctx.beginPath();ctx.arc(0,-16,9,0,6.283);ctx.fill();
  // göz bandı
  ctx.fillStyle=skinCol(t,-1);ctx.fillRect(1,-18,8,2.6);
  // kollar
  ctx.strokeStyle='#000';ctx.lineWidth=4.5;
  ctx.beginPath();
  if(rope&&rope.tip>=1){ctx.moveTo(-3,-6);ctx.lineTo(-2,-26);ctx.moveTo(3,-6);ctx.lineTo(4,-26)}
  else{ctx.moveTo(-3,-4);ctx.lineTo(-14,4+tuck*4);ctx.moveTo(3,-4);ctx.lineTo(13,-8)}
  // bacaklar
  ctx.moveTo(-3,12);ctx.lineTo(-6-tuck*4,26-tuck*8);ctx.moveTo(3,12);ctx.lineTo(7,24-tuck*10);
  ctx.stroke();
  // ince neon kontur
  ctx.globalCompositeOperation='lighter';ctx.strokeStyle=skinCol(t,0);ctx.globalAlpha=.55;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.arc(0,-16,9.5,-2.6,-.2);ctx.stroke();
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.restore();
}

function render(){
  const t=time;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  Z=zoneAt(Math.max(0,(P.x-startX)/40));
  const sg=ctx.createLinearGradient(0,0,0,H);sg.addColorStop(0,rgb(Z.sky[0]));sg.addColorStop(.55,rgb(Z.sky[1]));sg.addColorStop(1,rgb(Z.sky[2]));
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.scale(S,S);
  // yıldızlar
  for(const s of stars){ctx.globalAlpha=.35+.35*Math.sin(t*1.5+s.p);ctx.fillStyle='#fff';ctx.fillRect(s.x*VW,s.y*VH,s.r,s.r)}
  ctx.globalAlpha=1;
  // ay
  const mx=VW*.68-((camX*.02)%40), my=210-camY*.05;
  ctx.drawImage(GL.moon,mx-450,my-450,900,900);
  const mg=ctx.createRadialGradient(mx-30,my-30,10,mx,my,120);mg.addColorStop(0,rgb(Z.moon[0]));mg.addColorStop(1,rgb(Z.moon[1]));
  ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,120,0,6.283);ctx.fill();
  ctx.fillStyle='rgba(200,140,90,.18)';[[-40,-20,18],[30,30,24],[20,-50,10],[-20,50,12]].forEach(([a,b,r])=>{ctx.beginPath();ctx.arc(mx+a,my+b,r,0,6.283);ctx.fill()});
  // şehir
  LAYERS.forEach((L,i)=>drawLayer(L,i,camX,camY,t));
  // sis
  const fog=ctx.createLinearGradient(0,VH-260-camY*.3,0,VH);fog.addColorStop(0,rgb(Z.rim,0));fog.addColorStop(1,rgb(Z.rim,.16));
  ctx.fillStyle=fog;ctx.fillRect(0,VH-260-camY*.3,VW,400);

  // dünya
  const sx=(shake?(Math.random()-.5)*14*shake:0), sy=(shake?(Math.random()-.5)*14*shake:0);
  ctx.save();ctx.translate(-camX+sx,-camY+sy);

  // çapalar
  for(const a of anchors){
    if(a.x<camX-60||a.x>camX+VW+60)continue;
    const hl=a===hintA, r=11+a.pulse*8;
    ctx.globalCompositeOperation='lighter';ctx.drawImage(GL.cyan,a.x-42,a.y-42,84,84);ctx.globalCompositeOperation='source-over';
    ctx.strokeStyle=hl?'#ffffff':'#38f3ff';ctx.lineWidth=hl?3:2.2;ctx.beginPath();ctx.arc(a.x,a.y,r,0,6.283);ctx.stroke();
    ctx.fillStyle='#e8ffff';ctx.beginPath();ctx.arc(a.x,a.y,3,0,6.283);ctx.fill();
    if(hl){ctx.setLineDash([6,8]);ctx.strokeStyle='rgba(56,243,255,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(a.x,a.y);ctx.stroke();ctx.setLineDash([])}
  }
  // altınlar
  for(const c of coinsW){
    if(c.x<camX-40||c.x>camX+VW+40)continue;
    const s=c.taken?1+c.t*4:1, al=c.taken?1-c.t/.3:1, w=Math.abs(Math.cos(t*3+c.ph));
    ctx.globalAlpha=Math.max(0,al);
    ctx.globalCompositeOperation='lighter';ctx.drawImage(GL.gold,c.x-30*s,c.y-30*s,60*s,60*s);ctx.globalCompositeOperation='source-over';
    ctx.save();ctx.translate(c.x,c.y);ctx.scale(Math.max(.15,w)*s,s);ctx.rotate(Math.PI/4);
    ctx.fillStyle='#ffd23f';ctx.fillRect(-7,-7,14,14);ctx.fillStyle='#fff6b0';ctx.fillRect(-7,-7,6,6);ctx.restore();
    ctx.globalAlpha=1;
  }
  // dronlar
  for(const d of drones){
    if(d.x<camX-60||d.x>camX+VW+60)continue;
    const y=d.y+Math.sin(t*2+d.ph)*d.amp;
    ctx.globalCompositeOperation='lighter';ctx.drawImage(GL.red,d.x-60,y-60,120,120);ctx.globalCompositeOperation='source-over';
    ctx.save();ctx.translate(d.x,y);ctx.rotate(t*3+d.ph);
    ctx.fillStyle='#1a0006';ctx.strokeStyle='#ff3b4f';ctx.lineWidth=2;
    ctx.beginPath();for(let k=0;k<16;k++){const r=k%2?11:19,a=k/16*6.283;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff3b4f';ctx.beginPath();ctx.arc(0,0,4+Math.sin(t*10)*1.5,0,6.283);ctx.fill();ctx.restore();
  }
  // güçlendirmeler
  for(const pw of pows){
    if(pw.x<camX-60||pw.x>camX+VW+60)continue;
    const y=pw.y+Math.sin(t*3+pw.ph)*8, mg=pw.k==='magnet';
    ctx.globalCompositeOperation='lighter';ctx.drawImage(mg?GL.red:GL.cyan,pw.x-55,y-55,110,110);ctx.globalCompositeOperation='source-over';
    ctx.save();ctx.translate(pw.x,y);
    ctx.fillStyle='rgba(10,4,24,.85)';ctx.strokeStyle=mg?'#ff8a8a':'#7ff8ff';ctx.lineWidth=2.5;
    ctx.beginPath();for(let k=0;k<6;k++){const a=k/6*6.283+Math.PI/6;ctx.lineTo(Math.cos(a)*20,Math.sin(a)*20)}ctx.closePath();ctx.fill();ctx.stroke();
    ctx.lineWidth=4;ctx.lineCap='butt';
    if(mg){ctx.strokeStyle='#ff5a5f';ctx.beginPath();ctx.arc(0,-1,7,Math.PI,0,true);ctx.stroke();ctx.strokeStyle='#e8f0ff';ctx.beginPath();ctx.moveTo(-7,-1);ctx.lineTo(-7,6);ctx.moveTo(7,-1);ctx.lineTo(7,6);ctx.stroke()}
    else{ctx.fillStyle='#7ff8ff';ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(8,-6);ctx.lineTo(7,4);ctx.lineTo(0,10);ctx.lineTo(-7,4);ctx.lineTo(-8,-6);ctx.closePath();ctx.fill()}
    ctx.restore();
  }
  // iz
  ctx.globalCompositeOperation='lighter';
  for(const p of trail){ctx.globalAlpha=p.t*1.4;ctx.fillStyle=skinCol(t,0);ctx.beginPath();ctx.arc(p.x,p.y,6*p.t*4,0,6.283);ctx.fill()}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // ip
  if(rope&&state!=='dying'&&state!=='revive'){
    ctx.lineCap='round';
    ctx.globalCompositeOperation='lighter';ctx.strokeStyle='rgba(56,243,255,.35)';ctx.lineWidth=7;
    ctx.beginPath();ctx.moveTo(P.x,P.y-14);ctx.lineTo(rope.tx,rope.ty);ctx.stroke();
    ctx.globalCompositeOperation='source-over';ctx.strokeStyle='#d9feff';ctx.lineWidth=2;ctx.stroke();
  }
  if(state!=='dying'&&state!=='over'&&state!=='revive'&&!(invT>0&&Math.floor(t*14)%2)){drawNinja(t);
    if(shield){ctx.globalCompositeOperation='lighter';ctx.strokeStyle='rgba(127,248,255,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(P.x,P.y-4,30+Math.sin(t*6)*2,0,6.283);ctx.stroke();ctx.fillStyle='rgba(56,243,255,.08)';ctx.fill();ctx.globalCompositeOperation='source-over'}
    if(magnetT>0){ctx.strokeStyle='rgba(255,90,95,.25)';ctx.setLineDash([4,10]);ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(P.x,P.y,140+Math.sin(t*4)*8,0,6.283);ctx.stroke();ctx.setLineDash([])}
  }
  // parçacıklar
  ctx.globalCompositeOperation='lighter';
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.t*2);ctx.fillStyle=p.c;ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r)}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // yazılar
  ctx.textAlign='center';ctx.font='20px Bungee, Impact, sans-serif';
  for(const tx of texts){ctx.globalAlpha=Math.min(1,tx.t*2);ctx.fillStyle=tx.c;ctx.fillText(tx.s,tx.x,tx.y)}
  ctx.globalAlpha=1;
  ctx.restore();
  // hız çizgileri
  const spd=Math.hypot(P.vx,P.vy);
  if(state==='play'&&spd>1050&&!RM){const k=Math.min(1,(spd-1050)/450);ctx.strokeStyle=`rgba(255,255,255,${.18*k})`;ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<14;i++){const y=hsh(i*9+Math.floor(t*12))*VH,x=(hsh(i*5+Math.floor(t*12))*VW);ctx.moveTo(x,y);ctx.lineTo(x-80-60*k,y)}ctx.stroke()}
  // yağmur
  ctx.strokeStyle='rgba(180,200,255,.12)';ctx.lineWidth=1;ctx.beginPath();
  for(let i=0;i<70;i++){const x=(hsh(i)*VW*1.3+t*-260+camX*-.9)%(VW*1.3);const xx=x<0?x+VW*1.3:x;const y=(hsh(i+50)*VH+t*900)%VH;ctx.moveTo(xx,y);ctx.lineTo(xx-6,y+18)}
  ctx.stroke();
  // vinyet
  const vg=ctx.createRadialGradient(VW/2,VH/2,VH*.35,VW/2,VH/2,VH*.85);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,VW,VH);
  ctx.restore();
}

/* ---------- döngü ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);render();requestAnimationFrame(loop);
}

/* ---------- ödeme: Play Store uygulamasında Google Play Billing, tarayıcıda deneme modu ---------- */
const BILL=window.GNBilling||null;
function storePrices(){try{return BILL?JSON.parse(BILL.prices()||'{}'):{}}catch(e){return{}}}
function grantPack(id){
  const pk=PACKS.find(p=>p.id===id);if(!pk)return;
  gems+=pk.n;store.set('gems',gems);snd('coin');toast(`+${pk.n} elmas eklendi!`);
  if(!$('shop').classList.contains('hidden'))buildShop();refreshMenu();
  if(shopFromRevive&&state==='revive'&&gems>=REVIVE_COST){show('shop',false);doRevive();shopFromRevive=false}
}
window.onGNPurchase=id=>grantPack(id);
window.onGNPurchaseFail=msg=>{toast(msg||'Satın alma tamamlanmadı')};
function buyPack(pk){
  if(BILL){try{BILL.buy(pk.id)}catch(e){toast('Ödeme açılamadı')}return}
  // deneme modu (tarayıcı)
  gems+=pk.n;store.set('gems',gems);snd('coin');toast(`+${pk.n} elmas (deneme)`);buildShop();
  if(shopFromRevive&&gems>=REVIVE_COST){show('shop',false);doRevive();shopFromRevive=false}
}
/* ---------- görevler ---------- */
const MT={
  dist:{t:v=>`Tek oyunda ${v} m git`,base:[150,300,500,800,1200,1600],rw:v=>Math.round(v/5)},
  coin:{t:v=>`Toplam ${v} altın topla`,base:[30,60,120,200,300],rw:v=>Math.round(v*.8)},
  sup:{t:v=>`${v} kez "Süper!" yap`,base:[5,12,25,40],rw:v=>v*6},
  runs:{t:v=>`${v} oyun oyna`,base:[3,6,10],rw:v=>v*8},
  pow:{t:v=>`${v} güçlendirme topla`,base:[2,5,9],rw:v=>v*15},
  zone:{t:v=>`${ZONES[v%ZONES.length].n} bölgesine ulaş`,base:[1,2,3],rw:v=>v*80}
};
let mis=store.get('mis',null), misLvl=store.get('misLvl',0);
function newMis(excl){
  const keys=Object.keys(MT).filter(k=>!excl.includes(k)), k=keys[Math.floor(Math.random()*keys.length)], b=MT[k].base;
  const v=b[Math.min(b.length-1,Math.floor(misLvl/2)+Math.floor(Math.random()*2))];
  return {k,v,p:0};
}
if(!mis||mis.length!==3){mis=[];for(let i=0;i<3;i++)mis.push(newMis(mis.map(m=>m.k)));store.set('mis',mis)}
function misProgress(run){
  let newly=0;
  mis.forEach(m=>{const was=m.p>=m.v;
    if(m.k==='dist')m.p=Math.max(m.p,run.d);
    if(m.k==='coin')m.p+=run.c;
    if(m.k==='sup')m.p+=run.s;
    if(m.k==='runs')m.p+=1;
    if(m.k==='pow')m.p+=run.pw;
    if(m.k==='zone')m.p=Math.max(m.p,Math.floor(run.d/ZLEN));
    if(!was&&m.p>=m.v)newly++;});
  store.set('mis',mis);return newly;
}
function misBadge(){const n=mis.filter(m=>m.p>=m.v).length;const b=$('misBadge');b.hidden=!n;b.textContent=n}
function buildMis(){
  const L=$('misList');L.innerHTML='';
  mis.forEach((m,i)=>{const T=MT[m.k],done=m.p>=m.v,pct=Math.min(100,m.p/m.v*100),d=document.createElement('div');d.className='mi';
    d.innerHTML=`<div class="tx"><b>${T.t(m.v)}</b><div class="sub">${Math.min(m.p,m.v)} / ${m.v}</div><div class="bar"><i style="width:${pct}%"></i></div></div>`+
      (done?`<button class="claim">Al</button>`:`<span class="rw"><span class="coin" style="width:12px;height:12px"></span>${T.rw(m.v)} <i class="gem" style="width:12px;height:12px;margin-left:4px"></i>${Math.max(1,Math.round(T.rw(m.v)/60))}</span>`);
    const gw=Math.max(1,Math.round(T.rw(m.v)/60));
    if(done)d.querySelector('.claim').onclick=()=>{coins+=T.rw(m.v);gems+=gw;store.set('coins',coins);store.set('gems',gems);snd('coin');toast(`+${T.rw(m.v)} altın  +${gw} elmas`);
      misLvl++;store.set('misLvl',misLvl);mis[i]=newMis(mis.map(x=>x.k));store.set('mis',mis);buildMis();misBadge();refreshMenu()};
    L.appendChild(d)});
}
function showZone(z,i){
  const el=$('zone');$('zn').textContent=z.n;$('zs').textContent=z.s;el.style.setProperty('--zc',rgb(z.rim));el.style.opacity=1;
  clearTimeout(showZone.h);showZone.h=setTimeout(()=>el.style.opacity=0,2000);
  burst(P.x,P.y,20,rgb(z.rim),300);runC+=10;gems+=1;store.set('gems',gems);texts.push({x:P.x,y:P.y-70,t:1.4,s:'+10 altın  +1 elmas',c:'#ffd23f'});
}

/* ---------- arayüz ---------- */
function show(id,on){$(id).classList.toggle('hidden',!on)}
function refreshMenu(){$('bestM').textContent=best+' m';$('coinM').textContent=coins;$('gemM').textContent=gems;
  if($('wC')){$('wC').textContent=coins;$('wG').textContent=gems}}
function startGame(){
  touches=0;reset();reviveUsed=false;invT=0;state='play';
  if(boosts.shield>0){boosts.shield--;shield=true;texts.push({x:P.x,y:P.y-60,t:1.4,s:'Kalkan hazır!',c:'#7ff8ff'})}
  if(boosts.magnet>0){boosts.magnet--;magnetT=15}
  store.set('boosts',boosts);paused=false;show('menu',false);show('over',false);show('pause',false);$('hud').classList.remove('off');
  snd('fly');
}
function showRevive(){
  state='revive';reviveT=5;shopFromRevive=false;$('hud').classList.add('off');
  $('rvTx').textContent=gems>=REVIVE_COST?`${REVIVE_COST} ile devam et`:'Elmas al ve devam et';
  show('revive',true);
  const ab=$('rvAd');ab.hidden=true;
  if(window.Reklam)Reklam.odul('gn_devam',goster=>{ab.hidden=false;ab.onclick=()=>{ab.hidden=true;shopFromRevive=true;goster()}},()=>{shopFromRevive=false;doRevive(true)});
}
function doRevive(free){
  if(!free){gems-=REVIVE_COST;store.set('gems',gems)}reviveUsed=true;show('revive',false);
  let a=null,bd=1e9;for(const an of anchors){const dx=an.x-P.x;if(dx>-60&&dx<bd){bd=dx;a=an}}
  if(!a)a=anchors[anchors.length-1];
  drones=drones.filter(d=>Math.abs(d.x-a.x)>500);
  P.x=a.x-170;P.y=a.y+140;P.vx=560;P.vy=-60;
  rope={a,L:Math.hypot(170,140),tip:1,tx:a.x,ty:a.y};lastA=null;touches=0;
  scarf.forEach(s=>{s.x=s.px=P.x;s.y=s.py=P.y});
  invT=2.2;slow=1;shake=0;state='play';$('hud').classList.remove('off');
  burst(P.x,P.y,30,'#6fe9ff',380);snd('fly');texts.push({x:P.x,y:P.y-60,t:1.2,s:'Geri döndün!',c:'#9ff4ff'});
}
function showOver(){
  state='over';show('revive',false);const d=Math.floor(Math.max(0,P.x-startX)/40);
  coins+=runC;store.set('coins',coins);
  let rec='';if(d>best){best=d;store.set('best',best);rec='Yeni rekor!'}else rec='Rekor: '+best+' m';
  const nm=misProgress({d,c:runC,s:runSuper,pw:runPows});$('misDone').textContent=nm?`${nm} görev tamamlandı!`:'';misBadge();
  $('finalD').innerHTML=d+'<small>m</small>';$('finalC').textContent=runC;$('recTxt').textContent=rec;
  $('hud').classList.add('off');$('pw').innerHTML='';show('over',true);
}
function goMenu(){$('pw').innerHTML='';paused=false;state='menu';reset();
  ['over','pause','shop','missions','revive'].forEach(s=>show(s,false));show('menu',true);$('zone').style.opacity=0;$('hud').classList.add('off');refreshMenu()}
function setPause(on){if(state!=='play')return;paused=on;show('pause',on)}
function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,1600)}

let shopTab='skins';
function buildShop(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===shopTab));
  refreshMenu();
  const g=$('grid');g.innerHTML='';
  if(shopTab==='buy'){
    const pr=storePrices();
    PACKS.forEach((pk,i)=>{pk.show=pr[pk.id]||pk.tl;const b=document.createElement('button');b.className='pack';
      b.innerHTML=(pk.bonus?`<span class="bonus">${pk.bonus}</span>`:'')+`<div class="gems">${'<i class="gem" style="width:22px;height:22px"></i>'.repeat(i+1)}</div><b>${pk.n}</b><span class="tl">${pk.show}</span>`;
      b.onclick=()=>buyPack(pk);g.appendChild(b)});
    const n=document.createElement('div');n.className='note';n.style.gridColumn='1/-1';
    n.textContent=BILL?'Ödemeler Google Play üzerinden güvenle yapılır.':'Bu sürüm deneme sürümüdür: satın alma gerçek para çekmez, elmaslar test için eklenir. Play Store sürümünde ödeme Google Play üzerinden güvenle yapılır.';
    if(BILL){n.style.background='rgba(56,243,255,.06)';n.style.borderColor='rgba(56,243,255,.35)'}
    g.appendChild(n);return;
  }
  if(shopTab==='items'){
    ITEMS.forEach(it=>{const b=document.createElement('button');b.className='item';
      const have=it.id==='gold'?'':` · Elinde: ${boosts[it.id]||0}`;
      const ic=it.id==='shield'?'🛡️':it.id==='magnet'?'🧲':'<span class="coin" style="width:22px;height:22px"></span>';
      b.innerHTML=`<div class="sw" style="display:grid;place-items:center;font-size:24px">${ic}</div><b>${it.name}</b><span class="sub" style="font-size:12.5px">${it.d}${have}</span><span class="price"><i class="gem"></i>${it.gem}</span>`;
      b.onclick=()=>{if(gems<it.gem){toast('Yeterli elmas yok');shopTab='buy';buildShop();return}
        gems-=it.gem;store.set('gems',gems);
        if(it.id==='gold'){coins+=500;store.set('coins',coins);toast('+500 altın')}else{boosts[it.id]=(boosts[it.id]||0)+1;store.set('boosts',boosts);toast(it.name+' eklendi')}
        snd('coin');buildShop()};
      g.appendChild(b)});
    return;
  }
  SKINS.forEach(s=>{
    const own=owned.includes(s.id), b=document.createElement('button');
    b.className='item'+(skin===s.id?' sel':'');
    const sw=s.c==='fire'?'background:linear-gradient(90deg,#ff3b1f,#ffb21f,#fff1a8);box-shadow:0 0 16px #ff6a1f':
      s.c==='star'?'background:linear-gradient(90deg,#fff,#ffe9a8,#fff,#ffd23f);box-shadow:0 0 16px #fff3c4':
      s.c?`background:linear-gradient(90deg,${s.c[0]},${s.c[1]});box-shadow:0 0 14px ${s.c[0]}`:'background:linear-gradient(90deg,#ff2e88,#ffd23f,#2bff9a,#38f3ff,#a64dff);box-shadow:0 0 14px #a64dff';
    const cost=s.gem?`<i class="gem"></i>${s.gem}`:`<span class="coin"></span>${s.price}`;
    b.innerHTML=`<div class="sw"><i style="${sw}"></i></div><b>${s.name}</b><span class="price">${own?(skin===s.id?'Takılı':'Tak'):cost}</span>`;
    b.onclick=()=>{
      if(own){skin=s.id;store.set('skin',skin);buildShop();return}
      if(s.gem){if(gems>=s.gem){gems-=s.gem;owned.push(s.id);skin=s.id;store.set('gems',gems);store.set('owned',owned);store.set('skin',skin);snd('coin');toast(s.name+' atkı senin!');buildShop()}
        else{toast(`${s.gem-gems} elmas daha lazım`);shopTab='buy';buildShop()}return}
      if(coins>=s.price){coins-=s.price;owned.push(s.id);skin=s.id;store.set('coins',coins);store.set('owned',owned);store.set('skin',skin);snd('coin');toast(s.name+' atkı senin!');buildShop();refreshMenu()}
      else toast(`${s.price-coins} altın daha lazım`);
    };
    g.appendChild(b);
  });
}

// butonlar: dokunmatik ekranlarda da kesin çalışsın
function onTap(id,fn){const el=$(id);let lastT=0;
  const go=e=>{e.preventDefault();e.stopPropagation();const n=performance.now();if(n-lastT<400)return;lastT=n;fn(e)};
  el.addEventListener('click',go);
  el.addEventListener('pointerdown',e=>e.stopPropagation());}
// girişler
// dokunmatik: doğrudan touch olayları (uzun basışta tarayıcının hareketi devralmasını engeller)
let touches=0;
cv.addEventListener('touchstart',e=>{e.preventDefault();touches=e.touches.length;if(touches===1)press()},{passive:false});
cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
const tEnd=e=>{touches=e.touches.length;if(touches===0)release()};
cv.addEventListener('touchend',tEnd,{passive:false});cv.addEventListener('touchcancel',tEnd,{passive:false});
// fare
cv.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;e.preventDefault();press()});
addEventListener('pointerup',e=>{if(e.pointerType==='mouse')release()});
// güvenlik: oyun başlarken veya pencere odağı kaybolunca takılı kalmasın
addEventListener('blur',()=>{touches=0;release()});
document.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();if(state==='play')press()}if(e.code==='Escape')setPause(!paused)});
addEventListener('keyup',e=>{if(e.code==='Space')release()});
onTap('playB',startGame);onTap('againB',()=>{if(window.Reklam)Reklam.arada('gn_tekrar',startGame);else startGame()});onTap('homeB',goMenu);onTap('quitB',goMenu);
onTap('pauseB',()=>setPause(true));onTap('resumeB',()=>setPause(false));
onTap('shopB',()=>{shopTab='skins';buildShop();show('shop',true)});
onTap('rvB',()=>{if(gems>=REVIVE_COST)doRevive();else{shopFromRevive=true;shopTab='buy';buildShop();show('shop',true)}});
onTap('rvNo',()=>{show('revive',false);showOver()});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{shopTab=b.dataset.t;buildShop()}));
onTap('misB',()=>{buildMis();show('missions',true)});onTap('misClose',()=>{show('missions',false);refreshMenu()});onTap('shopClose',()=>{show('shop',false);refreshMenu();if(shopFromRevive){shopFromRevive=false;$('rvTx').textContent=gems>=REVIVE_COST?`${REVIVE_COST} ile devam et`:'Elmas al ve devam et'}});
const setMuteTxt=()=>$('muteB').textContent=muted?'🔇 Ses kapalı':'🔊 Ses açık';
onTap('muteB',()=>{muted=!muted;store.set('muted',muted);setMuteTxt()});setMuteTxt();
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true)});

resize();reset();refreshMenu();misBadge();requestAnimationFrame(loop);
})();
</script>
